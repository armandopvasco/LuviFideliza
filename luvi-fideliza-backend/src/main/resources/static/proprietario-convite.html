<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Convite do proprietário · LUVI Fideliza+</title><style>body{background:#f5f7f5;color:#263d4d;font-family:system-ui,sans-serif;padding:24px}.box{max-width:460px;margin:9vh auto;background:white;border:1px solid #dce5e3;border-radius:18px;padding:30px;box-shadow:0 6px 22px #2342}label{display:block;margin-top:15px;font-weight:600}input{width:100%;box-sizing:border-box;padding:12px;margin-top:6px;border:1px solid #aabbbd;border-radius:8px}button{background:#34566b;color:white;border:0;border-radius:8px;padding:12px 18px;margin-top:20px;cursor:pointer}p{line-height:1.5}.error{color:#a12b32}</style></head><body><main class="box"><h1>Bem-vindo ao Fideliza+</h1><p>Você foi convidado para administrar um estabelecimento. Informe seus dados para criar sua conta de proprietário.</p><form id="form"><label for="nome">Seu nome</label><input id="nome" maxlength="120" required autocomplete="name"><label for="senha">Crie uma senha (12 a 72 caracteres)</label><input id="senha" type="password" minlength="12" maxlength="72" required autocomplete="new-password"><label for="confirmarSenha">Confirme a senha</label><input id="confirmarSenha" type="password" minlength="12" maxlength="72" required autocomplete="new-password"><button id="botao">Aceitar convite e criar conta</button></form><p id="mensagem" role="status"></p></main><script>
const token=new URLSearchParams(location.hash.slice(1)).get('token');const msg=document.getElementById('mensagem');if(!token){msg.textContent='Link de convite inválido ou sem token.';document.getElementById('form').hidden=true;}
document.getElementById('confirmarSenha').addEventListener('input',e=>e.target.setCustomValidity(''));document.getElementById('form').onsubmit=async e=>{e.preventDefault();const senha=document.getElementById('senha').value;if(senha!==document.getElementById("confirmarSenha").value){const c=document.getElementById("confirmarSenha");c.setCustomValidity("As senhas não coincidem.");c.reportValidity();c.focus();return;}document.getElementById("confirmarSenha").setCustomValidity("");if(!/^[\x20-\x7e]{12,72}$/.test(senha)){msg.textContent='A senha deve ter de 12 a 72 caracteres sem acentos ou emojis.';return;}const botao=document.getElementById('botao');botao.disabled=true;msg.textContent='Validando convite...';try{const csrfR=await fetch('/api/v1/auth/csrf',{credentials:'same-origin'});if(!csrfR.ok)throw new Error('Falha ao preparar a operação.');const csrf=await csrfR.json();const r=await fetch('/api/v1/auth/convites/aceitar',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json',[csrf.headerName]:csrf.token},body:JSON.stringify({token,nome:document.getElementById('nome').value.trim(),senha})});const data=await r.json();if(!r.ok)throw new Error(data.mensagem||'Não foi possível aceitar o convite.');history.replaceState(null,'',location.pathname);msg.textContent='Cadastro concluído. Entrando no painel...';const login=await fetch('/api/v1/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/x-www-form-urlencoded',[csrf.headerName]:csrf.token},body:new URLSearchParams({email:data.email,password:senha})});if(!login.ok)throw new Error('Cadastro realizado, mas não foi possível iniciar a sessão automaticamente. Entre pelo painel.');location.replace('/painel.html');}catch(erro){msg.textContent=erro.message;msg.className='error';botao.disabled=false;}};
</script></body></html>

<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LUVI Fideliza+ | Participar</title><link rel="stylesheet" href="/luvi-tokens.css"><link rel="stylesheet" href="/cliente.css"></head><body><header><div class="brand"><img src="/luvi-simbolo.png" alt="LUVI"><strong>LUVI Fideliza+</strong></div></header><main><h1 id="loja">Participar do programa</h1><p>Entre ou crie uma conta para vincular-se ao estabelecimento.</p><section id="acesso"><form id="login"><h2>Já tenho conta</h2><label>Telefone ou e-mail<input name="email" required autocomplete="username"></label><label>Senha<input name="senha" type="password" required></label><button>Entrar e participar</button></form><form id="cadastro"><h2>Criar conta</h2><label>Nome<input name="nome" required maxlength="120"></label><label>Celular com DDD (opcional)<input name="telefone" type="tel"></label><label>E-mail (opcional)<input name="email" type="email"></label><small>Informe pelo menos telefone ou e-mail.</small><label>Senha<input name="senha" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmar" type="password" minlength="12" maxlength="72" required autocomplete="new-password"></label><button>Criar conta e participar</button></form></section><p id="mensagem" role="status"></p></main><script src="/adesao.js?v=0901" defer></script></body></html>

spring.application.name=luvi-fideliza-backend
server.port=${LUVI_FIDELIZA_PORT:8081}
spring.datasource.url=${LUVI_FIDELIZA_DB_URL}
spring.datasource.username=${LUVI_FIDELIZA_DB_USER}
spring.datasource.password=${LUVI_FIDELIZA_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never

server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
luvi.bootstrap.enabled=${LUVI_FIDELIZA_BOOTSTRAP_ENABLED:false}
luvi.bootstrap.email=${LUVI_FIDELIZA_ADMIN_EMAIL:}
luvi.bootstrap.password=${LUVI_FIDELIZA_ADMIN_PASSWORD:}

# Uma meta deve ser inteira; não truncar 2.5 para 2.
spring.jackson.deserialization.accept-float-as-int=false
